# Overlay targets for the promote/rebase tooling. Read by dev/overlaylib.sh.
#
# One target per line, whitespace separated:
#
#   name   feature-branch   overlay-branch   [wds-port] [api-port]
#
# * The feature branch is the reviewable PR: feature-only, no dev tooling.
# * The overlay branch is stacked on it and carries dev/** plus the DEV regions.
# * The name is what the tools accept (dev/overlay.sh <name> ...); it is also
#   how a run says which target it means.
# * Ports default to 3000/8080. A second target needs its own pair so two dev
#   trees can run at once (dev/overlay.sh <name> dev sets WDS_PORT/API_PORT; the
#   client reads the API port off the page, so it follows without a rebuild).
#
# The FIRST target is the default: plain `./dev/promote.sh` in a tree whose
# branch is not itself an overlay means sub-tunes, exactly as before. A run from
# an overlay branch always means that branch's target.
#
# Adding a target does not require editing any script: add a line, then
#   dev/overlay.sh <name> new     # dev/overlay-<name> = feature/<name> + dev/kit
subtunes   feature/subtunes-as-first-class   dev/overlay-subtunes    3000 8080

# Example second target (feature branch + its own overlay worktree on 3300/8180):
# gba      feature/gba-support                 dev/overlay-gba 3300 8180
